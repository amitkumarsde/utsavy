<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0A0C" />
    <!-- {{...}} values come from `meta` and `images` in src/data/wedding.js (see vite.config.js) -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{shareTitle}}" />
    <meta property="og:description" content="{{shareDescription}}" />
    <meta property="og:image" content="{{shareImage}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300..700&family=Tiro+Devanagari+Hindi&display=swap"
    />
    <!-- Load the hero photo early (same sizes as the hero image) -->
    <link rel="preload" as="image" fetchpriority="high" imagesrcset="{{heroSrcSet}}" imagesizes="{{heroSizes}}" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:serif;color:#F5ECDD;background:#0E0A0C">{{noscript}}</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
